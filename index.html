<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>DevClub - Convert Money</title>
</head>

<body>

    <main>
        <label>
            Converter <b>de</b>
            <select class="currency-first-select">
                <option value="real">R$ Real Brasileiro</option>
                <option value="dolar">US$ Dólar EUA</option>
                <option value="euro">€ Euro</option>
                <option value="libra">£ Libra Esterlina</option>
                <option value="bitcoin">₿ Bitcoin</option>
            </select>
        </label>

        <label>
            Converter <b>para</b>
            <select class="currency-select">
                <option value="real">R$ Real Brasileiro</option>
                <option value="dolar">US$ Dólar EUA</option>
                <option value="euro">€ Euro</option>
                <option value="libra">£ Libra Esterlina</option>
                <option value="bitcoin">₿ Bitcoin</option>
            </select>
        </label>

        <label>
            Valor
            <input class="input-currency" type="number" step="any" placeholder="Digite um valor">
        </label>

        <button class="convert-button">Converter</button>

        <section>
            <div class="currency-first-box">
                <img class="currency-img-to-convert" src="./assets/brasil.png" alt="logo-moeda-a-converter">
                <p class="currency" id="first-currency-name">Real</p>
                <p class="currency-value-to-convert">R$ 0,00</p> 
            </div>

            <img class="arrow-img" src="./assets/arrow.png" alt="seta">

             <div class="currency-box">
                <img class="currency-img" src="./assets/estados-unidos.png" alt="logo-moeda-convertida">
                <p class="currency" id="currency-name">Dólar americano</p>
                <p class="currency-value">US$ 0,00</p> 
            </div>
        </section>
    </main>

    <script src="./scripts.js"></script>

</body>

</html>
